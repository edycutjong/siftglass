<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Core Gradients -->
    <linearGradient id="cyanToRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="lensAmbient" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="threatPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgVignette" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Clips & Filters -->
    <clipPath id="lensClip">
      <circle cx="210" cy="210" r="115"/>
    </clipPath>
    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgVignette)"/>

  <!-- Grid texture -->
  <pattern id="gridPat" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0V28M0 28H28" stroke="#0f172a" stroke-width="0.5" fill="none"/>
  </pattern>
  <rect width="512" height="512" fill="url(#gridPat)"/>

  <!-- Dot grid overlay -->
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.6" fill="#1e293b" opacity="0.5"/>
  </pattern>
  <rect width="512" height="512" fill="url(#dots)"/>

  <!-- Ambient glow behind lens -->
  <circle cx="210" cy="210" r="200" fill="url(#lensAmbient)" filter="url(#softBlur)"/>

  <!-- ═══ MAGNIFYING GLASS ═══ -->
  <g filter="url(#outerGlow)">
    <!-- Outer lens bezel -->
    <circle cx="210" cy="210" r="128" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.2"/>
    <circle cx="210" cy="210" r="120" fill="none" stroke="url(#ringGrad)" stroke-width="5"/>
    <circle cx="210" cy="210" r="114" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>

    <!-- Inner glass fill — translucent -->
    <circle cx="210" cy="210" r="113" fill="#020617" fill-opacity="0.6"/>

    <!-- ═══ SHATTERED GLASS CRACKS ═══ -->
    <g clip-path="url(#lensClip)" opacity="0.55">
      <!-- Impact point: center-right of lens -->
      <!-- Primary radial fractures -->
      <line x1="250" y1="195" x2="325" y2="130" stroke="#22d3ee" stroke-width="2.5"/>
      <line x1="250" y1="195" x2="310" y2="280" stroke="#06b6d4" stroke-width="2"/>
      <line x1="250" y1="195" x2="170" y2="120" stroke="#06b6d4" stroke-width="2"/>
      <line x1="250" y1="195" x2="120" y2="230" stroke="#0891b2" stroke-width="1.5"/>
      <line x1="250" y1="195" x2="190" y2="320" stroke="#0891b2" stroke-width="1.5"/>
      <line x1="250" y1="195" x2="320" y2="195" stroke="#22d3ee" stroke-width="2.5"/>
      <line x1="250" y1="195" x2="280" y2="140" stroke="#06b6d4" stroke-width="1.8"/>
      <!-- Concentric ring fractures -->
      <path d="M200 150 Q230 140 260 155" fill="none" stroke="#0e7490" stroke-width="0.8"/>
      <path d="M180 240 Q220 260 270 240" fill="none" stroke="#0e7490" stroke-width="0.8"/>
      <path d="M230 120 Q270 130 290 170" fill="none" stroke="#0e7490" stroke-width="0.7"/>
      <!-- Tertiary micro-fractures -->
      <line x1="190" y1="165" x2="155" y2="175" stroke="#0e7490" stroke-width="0.6"/>
      <line x1="220" y1="245" x2="185" y2="290" stroke="#0e7490" stroke-width="0.6"/>
      <line x1="270" y1="225" x2="295" y2="255" stroke="#0e7490" stroke-width="0.6"/>
      <line x1="225" y1="155" x2="210" y2="135" stroke="#0e7490" stroke-width="0.5"/>
    </g>

    <!-- ═══ ATTACK GRAPH NODES (through glass) ═══ -->
    <g clip-path="url(#lensClip)">
      <!-- Graph edges -->
      <line x1="185" y1="175" x2="250" y2="200" stroke="#06b6d4" stroke-width="1.5" opacity="0.45"/>
      <line x1="250" y1="200" x2="230" y2="265" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
      <line x1="250" y1="200" x2="160" y2="250" stroke="#06b6d4" stroke-width="1.2" opacity="0.35"/>
      <line x1="185" y1="175" x2="140" y2="185" stroke="#06b6d4" stroke-width="1" opacity="0.25"/>
      <line x1="250" y1="200" x2="280" y2="160" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>

      <!-- Node glows -->
      <circle cx="250" cy="200" r="18" fill="url(#threatPulse)" filter="url(#nodeGlow)"/>

      <!-- Benign nodes (cyan) -->
      <circle cx="185" cy="175" r="7" fill="#06b6d4" opacity="0.8"/>
      <circle cx="160" cy="250" r="5.5" fill="#06b6d4" opacity="0.55"/>
      <circle cx="140" cy="185" r="4" fill="#06b6d4" opacity="0.35"/>
      <circle cx="230" cy="265" r="5.5" fill="#06b6d4" opacity="0.55"/>
      <circle cx="280" cy="160" r="4.5" fill="#06b6d4" opacity="0.45"/>

      <!-- THREAT NODE (red core) -->
      <circle cx="250" cy="200" r="10" fill="none" stroke="#ef4444" stroke-width="2.5"/>
      <circle cx="250" cy="200" r="4" fill="#ef4444"/>
    </g>

    <!-- Lens reflection -->
    <ellipse cx="175" cy="170" rx="45" ry="25" fill="white" opacity="0.035" transform="rotate(-25 175 170)"/>

    <!-- ═══ HANDLE ═══ -->
    <line x1="305" y1="305" x2="435" y2="435" stroke="url(#handleGrad)" stroke-width="20" stroke-linecap="round"/>
    <line x1="305" y1="305" x2="435" y2="435" stroke="#020617" stroke-width="9" stroke-linecap="round"/>
    <!-- Handle grip lines -->
    <line x1="370" y1="362" x2="395" y2="387" stroke="#0e7490" stroke-width="0.8" opacity="0.3"/>
    <line x1="380" y1="372" x2="405" y2="397" stroke="#0e7490" stroke-width="0.8" opacity="0.25"/>
  </g>

  <!-- ═══ HUD DECORATIONS ═══ -->
  <!-- Top-left bracket -->
  <path d="M28 62 L28 28 L62 28" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.35"/>
  <!-- Bottom-right bracket -->
  <path d="M450 484 L484 484 L484 450" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.35"/>
  <!-- Top-right bracket -->
  <path d="M450 28 L484 28 L484 62" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.2"/>
  <!-- Bottom-left bracket -->
  <path d="M28 450 L28 484 L62 484" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.2"/>

  <!-- Scan lines -->
  <line x1="45" y1="400" x2="115" y2="400" stroke="#06b6d4" stroke-width="1" opacity="0.18"/>
  <line x1="45" y1="412" x2="85" y2="412" stroke="#06b6d4" stroke-width="1" opacity="0.12"/>
  <line x1="45" y1="424" x2="70" y2="424" stroke="#06b6d4" stroke-width="1" opacity="0.08"/>
  <line x1="400" y1="55" x2="468" y2="55" stroke="#ef4444" stroke-width="1" opacity="0.12"/>
  <line x1="420" y1="67" x2="468" y2="67" stroke="#ef4444" stroke-width="1" opacity="0.08"/>

  <!-- Corner data points -->
  <circle cx="55" cy="436" r="2" fill="#06b6d4" opacity="0.25"/>
  <circle cx="65" cy="436" r="1.5" fill="#06b6d4" opacity="0.15"/>
  <circle cx="468" cy="45" r="2" fill="#ef4444" opacity="0.25"/>
</svg>
